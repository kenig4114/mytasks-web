<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>המשימות שלי</title>
<link rel="stylesheet" href="leaflet.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f6bed">
<link rel="icon" href="icon-192.png">
<style>
  @font-face{font-family:'Rubik';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/rubik-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
  @font-face{font-family:'Rubik';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/rubik-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Rubik';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/rubik-hebrew-500-normal.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
  @font-face{font-family:'Rubik';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/rubik-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'Rubik';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/rubik-hebrew-600-normal.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
  @font-face{font-family:'Rubik';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/rubik-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  :root{
    --bg:#f6f6f3; --card:#fff; --ink:#1f2328; --muted:#7a7f87; --line:#e6e6e1;
    --accent:#4f6bed; --done:#a3a7ad; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,sans-serif;font-size:16px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  input,textarea{font:inherit;color:inherit}
  .wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 6px) 14px calc(env(safe-area-inset-bottom) + 120px)}
  body{user-select:none;-webkit-user-select:none} input,textarea{user-select:text;-webkit-user-select:text}

  /* header */
  header{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 10px}
  .title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{font-size:24px;font-weight:600;margin:0}
  .pill{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--card)}
  .pill.on{color:var(--accent);border-color:var(--accent)}
  .search{margin-top:10px;position:relative}
  .search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 40px 11px 14px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search .ico{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  .search .clr{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px;width:30px;height:30px;display:none}
  .search.has .clr{display:block}

  /* categories */
  #cats{display:flex;flex-direction:column;gap:14px;margin-top:6px}
  .cat{--c:#6C8CF5;border:2px solid var(--c);border-radius:var(--radius);background:color-mix(in srgb,var(--c) 6%,#fff);padding:6px 6px 8px}
  .cat-head{display:flex;align-items:center;gap:6px;padding:4px 4px 6px}
  .cat-name{flex:1;text-align:right;font-weight:600;font-size:17px;color:color-mix(in srgb,var(--c) 70%,#000);padding:4px 2px}
  .cat-count{font-size:12px;color:var(--muted);background:#fff;border-radius:999px;padding:2px 8px}
  .icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:18px}
  .icon-btn:active{background:rgba(0,0,0,.06)}
  .handle{cursor:grab;touch-action:none;color:#b9bcc2;font-size:18px;letter-spacing:-3px;width:26px;height:34px;display:grid;place-items:center;user-select:none;flex:none}
  .collapsed .arrow{transform:rotate(90deg)}
  .arrow{transition:transform .15s}

  ul{list-style:none;margin:0;padding:0}
  .tasks{min-height:8px;display:flex;flex-direction:column;gap:6px}
  .task{background:var(--card);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);padding:4px 4px 4px 8px}
  .t-row,.s-row{display:flex;align-items:flex-start;gap:4px}
  .chk{flex:none;width:24px;height:24px;margin:7px 2px 0 6px;border:2px solid #c5c8ce;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:15px;transition:all .12s}
  .chk.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
  .t-body{flex:1;min-width:0;text-align:right;padding:8px 2px 8px 0}
  .t-text{line-height:1.35;word-wrap:break-word;white-space:pre-wrap}
  .done > .t-row .t-text,.s-done .s-text{color:var(--done);text-decoration:line-through}
  .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:3px}
  .subs{margin:0 34px 4px 0;min-height:0;border-right:2px solid var(--line);padding-right:6px}
  .sub .s-row{align-items:center}
  .sub .chk{width:20px;height:20px;margin:4px 2px 4px 6px;border-radius:6px;font-size:12px}
  .sub .handle{height:28px;width:22px;font-size:15px}
  .s-text{flex:1;font-size:15px;padding:5px 0;text-align:right;word-wrap:break-word}
  body.drag-sub .subs{min-height:30px;border-right-style:dashed;border-right-color:var(--accent)}
  .quick{display:flex;gap:6px;margin-top:8px;padding:0 2px}
  .quick input{flex:1;border:1px dashed color-mix(in srgb,var(--c) 45%,#ccc);background:rgba(255,255,255,.7);border-radius:10px;padding:10px 12px;outline:none}
  .quick input:focus{border-style:solid;background:#fff}
  .empty-msg{font-size:14px;color:var(--muted);padding:6px 10px}
  .ghost{opacity:.35}
  .chosen{box-shadow:0 8px 24px rgba(0,0,0,.15)}
  .add-cat{display:block;width:100%;margin-top:16px;border:2px dashed #cfd2d7;border-radius:var(--radius);padding:14px;color:var(--muted);font-weight:500}
  .status{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
  .noresults{text-align:center;color:var(--muted);padding:30px 0}

  /* overlay + sheet */
  .overlay{position:fixed;inset:0;background:rgba(20,22,26,.35);z-index:50;display:none}
  .overlay.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
  .sheet.show{transform:none}
  .sheet-in{max-width:640px;margin:0 auto;padding:10px 18px calc(env(safe-area-inset-bottom) + 28px)}
  .grab{width:42px;height:5px;border-radius:9px;background:#ddd;margin:2px auto 10px}
  .sheet textarea.title{width:100%;border:0;font-size:20px;font-weight:600;resize:none;outline:none;padding:4px 0;min-height:34px}
  .sec{margin-top:18px}
  .sec h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px}
  .sheet textarea.notes{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:64px;resize:vertical;outline:none}
  .line-item{display:flex;align-items:center;gap:6px;padding:4px 0}
  .line-item input[type=text]{flex:1;border:0;border-bottom:1px solid transparent;padding:6px 2px;outline:none;background:none}
  .line-item input[type=text]:focus{border-bottom-color:var(--line)}
  .line-item input[type=datetime-local]{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;min-width:0}
  .cal-btn{font-size:18px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;flex:none}
  .x{color:#b0b3b8;font-size:20px;width:32px;height:32px}
  .add-line{color:var(--accent);font-weight:500;padding:8px 0;display:inline-block}
  .add-input{width:100%;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;outline:none;margin-top:4px}
  .gc{font-size:13px;color:var(--accent);text-decoration:none;white-space:nowrap;border:1px solid color-mix(in srgb,var(--accent) 35%,#fff);border-radius:8px;padding:6px 8px}
  .hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:6px;background:#f6f7fb;border-radius:10px;padding:8px 10px}
  .imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .imgs .th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eee}
  .imgs .th img{width:100%;height:100%;object-fit:cover;display:block}
  .imgs .th .del{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:24px;height:24px;font-size:14px}
  .imgs label.addimg{aspect-ratio:1;border:2px dashed #d4d6db;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;cursor:pointer}
  .sheet-foot{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
  .btn{background:var(--accent);color:#fff;border-radius:12px;padding:11px 22px;font-weight:500}
  .btn.ghost-btn{background:none;color:#d64545;padding:11px 4px}

  /* modal */
  .modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.show{display:flex}
  .modal-box{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
  .modal-box h4{margin:0 0 12px;font-size:17px}
  .modal-box input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}
  .modal-box .btns{display:flex;gap:8px;justify-content:flex-start;margin-top:14px}
  .modal-box .btns .sec-btn{padding:11px 16px;color:var(--muted)}
  .colors{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .colors button{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ddd}
  .colors button.sel{box-shadow:0 0 0 2px var(--ink)}
  .menu-list button{display:block;width:100%;text-align:right;padding:12px 6px;border-bottom:1px solid var(--line)}
  .menu-list button:last-child{border:0}
  .menu-list .danger{color:#d64545}

  /* viewer, toast, alarm */
  .viewer{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}
  .viewer.show{display:flex}
  .viewer img,.viewer video{max-width:96vw;max-height:90vh;border-radius:8px}
  .imgs .th video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .imgs .th .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:26px;text-shadow:0 1px 6px rgba(0,0,0,.6);pointer-events:none}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:#24272c;color:#fff;border-radius:12px;padding:12px 16px;z-index:95;display:flex;gap:14px;align-items:center;transition:transform .2s;font-size:15px;max-width:92vw}
  .toast.show{transform:translateX(-50%)}
  .toast button{color:#9fb0ff;font-weight:600}
  .alarm{position:fixed;top:12px;left:12px;right:12px;z-index:99;background:#fff;border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.25);padding:14px 16px;display:none;border-right:6px solid var(--accent);max-width:600px;margin:0 auto}
  .alarm.show{display:block;animation:pop .3s}
  .alarm b{display:block;font-size:13px;color:var(--accent);margin-bottom:4px}
  .pp{position:fixed;inset:0;z-index:85;background:#fff;display:flex;flex-direction:column}
  #ppMap{flex:1;min-height:200px}
  .pp-pin{position:absolute;left:50%;top:calc((100% - 330px)/2);transform:translate(-50%,-100%);font-size:38px;z-index:500;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
  .pp-me{position:absolute;top:calc(env(safe-area-inset-top) + 72px);left:14px;z-index:500;background:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-weight:500;color:var(--accent)}
  .pp-search{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;z-index:700}
  .pp-search input{width:100%;border:0;border-radius:12px;padding:13px 14px;box-shadow:0 2px 12px rgba(0,0,0,.18);outline:none;background:#fff}
  #ppRes{margin-top:6px;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.15);overflow:hidden;max-height:45vh;overflow-y:auto}
  #ppRes:empty{display:none}
  .pp-r{display:block;width:100%;text-align:right;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.4}
  .pp-r.muted{color:var(--muted)}
  .pp-panel{height:330px;box-sizing:border-box;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);background:#fff;box-shadow:0 -6px 20px rgba(0,0,0,.08);z-index:600}
  .pp-panel input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}
  .pp-row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--muted)}
  .chip{border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--ink);background:#fff}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .seg{display:flex;background:#eef0f4;border-radius:999px;padding:3px}
  .seg button{padding:7px 16px;border-radius:999px;color:var(--muted);font-weight:500}
  .seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.12)}
  input[type=range]{accent-color:var(--accent);height:28px}
  .pp-hint{font-size:12.5px;color:var(--muted);margin-top:10px}
  .pp-btns{display:flex;gap:8px;margin-top:12px}
  .pp-btns .sec-btn{padding:11px 16px;color:var(--muted)}
  @keyframes pop{from{transform:translateY(-20px);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <h1>המשימות שלי</h1>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="toggleDone" class="pill">הסתר שבוצעו</button>
        <button id="settingsBtn" class="icon-btn" aria-label="הגדרות וגיבוי" style="font-size:20px">⚙️</button>
      </div>
    </div>
    <div class="search" id="searchBox">
      <span class="ico">🔍</span>
      <input id="q" type="search" placeholder="חיפוש משימה…" autocomplete="off">
      <button class="clr" id="qClr" aria-label="נקה">×</button>
    </div>
  </header>

  <main id="cats"></main>
  <div class="noresults" id="noRes" hidden>לא נמצאו משימות</div>
  <button id="addCat" class="add-cat">+ קטגוריה חדשה</button>
  <div class="status" id="status"></div>
</div>

<div class="overlay" id="overlay"></div>

<div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>

<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="viewer" id="viewer"><img id="viewerImg" alt=""><video id="viewerVid" controls playsinline style="display:none"></video></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn"></button></div>
<div class="alarm" id="alarm"><b>⏰ תזכורת</b><div id="alarmText"></div></div>

<input type="file" id="restoreFile" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
